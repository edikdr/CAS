name: HAOTICA Terminal (Windows)

on:
  push:
    branches: [terminal-windows]
    paths: ["core/**", "apps/**", "tests/**", "tools/**", "packaging/**", ".github/workflows/terminal-windows.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Зависимости
        run: python -m pip install --upgrade pip && pip install -r packaging/windows/requirements.txt pytest
      - name: Юнит и интеграционные тесты (ConPTY, PowerShell, Job Object)
        env:
          PYTHONIOENCODING: utf-8
        run: python -m pytest -q tests/py -ra
      - name: Ядро и агент стартуют
        shell: pwsh
        env:
          HAOTICA_DEV_ROOT: ${{ github.workspace }}
          PYTHONPATH: ${{ github.workspace }}\core
          HAOTICA_HOME: ${{ runner.temp }}\hh
        run: |
          $core = Start-Process python -ArgumentList "-m","haotica.server" -PassThru -NoNewWindow -RedirectStandardError "$env:RUNNER_TEMP\core.err"
          $agent = Start-Process python -ArgumentList "-m","haotica.agent" -PassThru -NoNewWindow -RedirectStandardError "$env:RUNNER_TEMP\agent.err"
          Start-Sleep 6
          $tok = Get-Content "$env:HAOTICA_HOME\state\token"
          $p = Invoke-RestMethod -Headers @{ "X-Haotica-Token" = $tok } http://127.0.0.1:47800/api/platform
          if ($p.features.platform -ne "windows") { throw "platform: $($p.features.platform)" }
          $s = Invoke-RestMethod -Headers @{ "X-Haotica-Token" = $tok } http://127.0.0.1:47810/api/status
          Write-Output "agent: $($s.state) / $($s.llm_state)"
          $r = Invoke-WebRequest -SkipHttpErrorCheck -Headers @{ "X-Haotica-Token" = $tok } http://127.0.0.1:47800/api/wifi
          if ($r.StatusCode -ne 501) { throw "Linux-маршрут должен отвечать 501, а ответил $($r.StatusCode)" }
          Stop-Process -Id $core.Id, $agent.Id -Force
          Get-Content "$env:RUNNER_TEMP\core.err" -Tail 20

  ui:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Зависимости
        run: |
          pip install -r packaging/windows/requirements.txt
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Playwright — терминал (UI-INVENTORY) и мини-чат с цепочками команд
        env:
          PYTHON: python
          PYTHONIOENCODING: utf-8
        run: |
          node tests/ui/terminal.spec.mjs
          node tests/ui/chat.spec.mjs

  build:
    runs-on: windows-latest
    needs: test
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: PyInstaller
        run: |
          pip install -r packaging/windows/requirements.txt pyinstaller
          pyinstaller packaging/windows/HaoticaTerminal.spec --noconfirm --distpath dist --workpath build
          if (-not (Test-Path dist\HaoticaTerminal\_internal\winpty\OpenConsole.exe)) { throw "в сборке нет winpty\OpenConsole.exe" }
      - name: Оболочки в оконном exe без консоли (как у пользователя)
        shell: pwsh
        env:
          HAOTICA_HOME: ${{ runner.temp }}\hh-pty
        run: |
          $out = "$env:RUNNER_TEMP\ptyprobe.json"
          $p = Start-Process dist\HaoticaTerminal\HaoticaTerminal.exe -ArgumentList "--module","haotica.apps.ptyprobe",$out -PassThru -Wait
          if (Test-Path $out) { Get-Content $out -Raw } else { Write-Output "нет результата, код $($p.ExitCode)" }
          $global:LASTEXITCODE = 0
          if (-not (Test-Path $out)) { throw "оконный exe не отработал" }
          $rows = Get-Content $out -Raw | ConvertFrom-Json
          $bad = @($rows | Where-Object { -not $_.ok })
          if ($bad.Count -or -not $rows) { throw "оболочки не работают в оконном exe: $($bad.id -join ', ')" }
      - name: Сравнение — те же проверки обычным Python (не в exe)
        continue-on-error: true   # только справка: в логе видно, совпадает ли поведение exe и Python
        shell: pwsh
        env:
          HAOTICA_DEV_ROOT: ${{ github.workspace }}
          PYTHONPATH: ${{ github.workspace }}\core
          HAOTICA_HOME: ${{ runner.temp }}\hh-pyref
        run: |
          python -m haotica.apps.ptyprobe $env:RUNNER_TEMP\ref.json
          Get-Content $env:RUNNER_TEMP\ref.json -Raw
          Write-Output "== winpty в сборке:"; Get-ChildItem dist\HaoticaTerminal\_internal\winpty | Select-Object Name, Length
      - name: Смоук собранного exe
        shell: pwsh
        env:
          HAOTICA_HOME: ${{ runner.temp }}\hh-built
        run: |
          & dist\HaoticaTerminal\haotica.exe llama status
          $doc = & dist\HaoticaTerminal\haotica.exe doctor | Out-String
          Write-Output $doc; Write-Output "doctor: $LASTEXITCODE (на раннере нет моделей и GPU — FAIL ожидаем)"
          $global:LASTEXITCODE = 0
          if ($doc -match "СТАРТ[^\r\n]*FAIL") { throw "оболочка не стартует в собранном exe (см. СТАРТ выше)" }
          if ($doc -notmatch "СТАРТ") { throw "doctor не проверил старт оболочек" }
          $core = Start-Process dist\HaoticaTerminal\HaoticaTerminal.exe -ArgumentList "--module","haotica.server" -PassThru
          Start-Sleep 10
          try {
            $tok = Get-Content "$env:HAOTICA_HOME\state\token"
            $p = Invoke-RestMethod -Headers @{ "X-Haotica-Token" = $tok } http://127.0.0.1:47800/api/platform
            if ($p.features.platform -ne "windows") { throw "ядро из сборки не ответило" }
          } catch {
            Write-Output "== core.log"; Get-Content "$env:HAOTICA_HOME\logs\core.log" -ErrorAction SilentlyContinue | Select-Object -Last 40
            Write-Output "== процесс жив: $(-not $core.HasExited) код: $($core.ExitCode)"
            throw
          }
          $page = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:47800/apps/terminal/index.html
          if ($page.StatusCode -ne 200) { throw "нет страницы терминала в сборке" }
          Stop-Process -Id $core.Id -Force
          $global:LASTEXITCODE = 0
      - name: Окно целиком — ядро, агент, страница отрисована
        shell: pwsh
        env:
          HAOTICA_HOME: ${{ runner.temp }}\hh-win
        run: |
          $w = Start-Process dist\HaoticaTerminal\HaoticaTerminal.exe -PassThru
          $log = "$env:HAOTICA_HOME\logs\window-terminal.log"
          for ($i = 0; $i -lt 60 -and -not ((Test-Path $log) -and (Select-String -Path $log -Pattern "проверка отрисовки" -Quiet)); $i++) { Start-Sleep 1 }
          Write-Output "== window log"; Get-Content $log -ErrorAction SilentlyContinue
          $tok = Get-Content "$env:HAOTICA_HOME\state\token" -ErrorAction SilentlyContinue
          $core = try { (Invoke-RestMethod -TimeoutSec 5 -Headers @{ "X-Haotica-Token" = $tok } http://127.0.0.1:47800/api/platform).features.platform } catch { "нет" }
          $agent = try { (Invoke-RestMethod -TimeoutSec 5 -Headers @{ "X-Haotica-Token" = $tok } http://127.0.0.1:47810/api/status).state } catch { "нет" }
          Write-Output "ядро: $core; агент: $agent; окно живо: $(-not $w.HasExited)"
          Get-ChildItem "$env:HAOTICA_HOME\logs" -ErrorAction SilentlyContinue | ForEach-Object { Write-Output "== $($_.Name)"; Get-Content $_.FullName -Tail 15 }
          Stop-Process -Id $w.Id -Force -ErrorAction SilentlyContinue
          $global:LASTEXITCODE = 0
          if ($core -ne "windows") { throw "ядро не поднялось из окна" }
          if ($agent -eq "нет") { throw "агент не поднялся из окна" }
          if (-not (Select-String -Path $log -Pattern "загружена" -Quiet)) { throw "страница терминала не загрузилась" }
          if (Select-String -Path $log -Pattern "безопасном режиме графики|js: " -Quiet) { throw "окно не отрисовалось или ошибки JS (см. журнал выше)" }
      - name: Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $ver = (Get-Content VERSION | Select-Object -First 1)
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$ver" packaging\windows\installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: HaoticaTerminal-Setup
          path: dist/HaoticaTerminal-Setup.exe
          retention-days: 14
