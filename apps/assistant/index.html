<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Haotica</title>
<link rel="stylesheet" href="/ui/hy.css"><link rel="stylesheet" href="assistant.css">
</head><body>
<div class="hy-app a-app">
  <header class="a-head" id="head">
    <div class="a-av" id="av"></div>
    <div class="a-who"><b>HAOTICA</b><span id="st">OFFLINE</span><span class="a-line" id="line"></span></div>
    <div class="a-badges"><button class="hy-badge" id="model" title="Модель: щелчок — base/deep">BASE</button>
      <button class="hy-btn ghost icon small" id="keys" title="API-ключи"></button>
      <button class="hy-btn ghost icon small" id="clear" title="Очистить разговор"></button></div>
  </header>
  <div class="a-log scroll" id="log"></div>
  <div class="a-cards" id="cards"></div>
  <footer class="a-input">
    <textarea class="hy-textarea" id="in" rows="2" placeholder="Спроси Haotica…  (/deep — глубокая модель, Shift+Enter — новая строка)"></textarea>
    <button class="hy-btn primary" id="send">▶</button>
  </footer>
</div>
<script type="module" src="assistant.js"></script>
</body></html>
