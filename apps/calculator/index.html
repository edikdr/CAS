<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Калькулятор — HAOTICA</title>
<link rel="stylesheet" href="/ui/hy.css">
<style>
  .c-wrap { flex: 1; display: flex; flex-direction: column; padding: 12px; gap: 10px; }
  .c-screen {
    background: var(--bg1); border: 1px solid var(--line); padding: 14px 16px;
    display: flex; flex-direction: column; align-items: flex-end; gap: 4px;
    clip-path: polygon(var(--chamfer) 0, 100% 0, 100% calc(100% - var(--chamfer)), calc(100% - var(--chamfer)) 100%, 0 100%, 0 var(--chamfer));
  }
  .c-expr { font: 12px var(--font-mono); color: var(--dim); min-height: 18px; }
  .c-val { font: 700 32px/1.1 var(--font-mono); color: var(--accent); word-break: break-all; }
  .c-bases { width: 100%; border-top: 1px solid var(--line); margin-top: 8px; padding-top: 6px; font: 11px/1.6 var(--font-mono); color: var(--dim); }
  .c-grid { flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .c-key {
    border: 1px solid var(--line); background: var(--bg1); color: var(--ink);
    font: 600 14px var(--font-mono); cursor: pointer; display: grid; place-items: center;
  }
  .c-key:hover { background: var(--hover); border-color: var(--line-hi); }
  .c-key.op { color: var(--teal); background: var(--bg2); }
  .c-key.eq { background: var(--accent); color: var(--bg0); border-color: var(--accent); }
</style>
</head>
<body>
<div class="hy-app">
  <div class="hy-body" style="flex-direction:column">
    <div class="hy-toolbar">
      <div id="modeSeg"></div>
      <span class="grow"></span>
      <span class="hy-badge">HEX / BIN / SCI</span>
    </div>
    <div class="c-wrap">
      <div class="c-screen">
        <div class="c-expr" id="cExpr">0</div>
        <div class="c-val" id="cVal">0</div>
        <div class="c-bases" id="cBases"></div>
      </div>
      <div class="c-grid" id="cGrid"></div>
    </div>
  </div>
</div>

<script type="module">
import { HY, el } from "/ui/hy.js";

await HY.start({ title: "Калькулятор", glyph: "calc" });
const $ = (id) => document.getElementById(id);

let expr = "";
let mode = "std";

$("modeSeg").append(HY.seg([["std", "ИНЖЕНЕРНЫЙ"], ["prog", "ПРОГРАММИСТ"]], "std", (m) => { mode = m; renderKeys(); updateDisplay(); }));

const KEYS_STD = [
  "C", "(", ")", "/",
  "sin", "cos", "sqrt", "*",
  "7", "8", "9", "-",
  "4", "5", "6", "+",
  "1", "2", "3", "^",
  "0", ".", "⌫", "="
];

const KEYS_PROG = [
  "C", "AND", "OR", "XOR",
  "A", "B", "C_HEX", "D",
  "7", "8", "9", "E",
  "4", "5", "6", "F",
  "1", "2", "3", "<<",
  "0", ">>", "⌫", "="
];

function evalSafe(s) {
  try {
    const clean = s
      .replace(/\^/g, "**")
      .replace(/sin\(/g, "Math.sin(")
      .replace(/cos\(/g, "Math.cos(")
      .replace(/sqrt\(/g, "Math.sqrt(")
      .replace(/AND/g, "&")
      .replace(/OR/g, "|")
      .replace(/XOR/g, "^");
    const res = Function(`"use strict"; return (${clean || 0})`)();
    return Number.isFinite(res) ? res : 0;
  } catch (e) { return 0; }
}

function updateDisplay() {
  $("cExpr").textContent = expr || "0";
  const val = evalSafe(expr || "0");
  $("cVal").textContent = String(Number(val.toFixed(8)));
  const n = Math.trunc(val) >>> 0;
  $("cBases").innerHTML =
    `HEX: <b style="color:var(--teal)">0x${n.toString(16).toUpperCase()}</b> · ` +
    `OCT: <b>0o${n.toString(8)}</b> · ` +
    `BIN: <b style="color:var(--violet)">${n.toString(2).padStart(8, "0")}</b>`;
}

function press(k) {
  if (k === "C") expr = "";
  else if (k === "⌫") expr = expr.slice(0, -1);
  else if (k === "=") expr = String(Number(evalSafe(expr).toFixed(8)));
  else if (k === "sin" || k === "cos" || k === "sqrt") expr += k + "(";
  else if (k === "C_HEX") expr += "0xC";
  else if (/^[A-F]$/.test(k)) expr += "0x" + k;
  else expr += k;
  updateDisplay();
}

function renderKeys() {
  const list = mode === "prog" ? KEYS_PROG : KEYS_STD;
  $("cGrid").replaceChildren(...list.map((k) => {
    const label = k === "C_HEX" ? "C" : k;
    const cls = k === "=" ? "c-key eq" : (/^[0-9.]$/.test(k) ? "c-key" : "c-key op");
    return el("button." + cls.replace(/\s+/g, "."), { onclick: () => press(k) }, label);
  }));
}

renderKeys();
updateDisplay();
</script>
</body>
</html>
