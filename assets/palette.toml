# HAOTICA — палитра. Единственный источник цветов для всех тем системы.
# Смысловые цвета (ошибка, успех, ИИ…) одинаковы во всех профилях,
# профиль меняет основной цвет текста и линий, фон и сигнатурный акцент.

[semantic]
teal   = "#5FA8A0"   # ссылки, файлы, интерактив, общение
amber  = "#E0A243"   # внимание, активное, соцсети
coral  = "#E0705A"   # ошибки, опасные действия, игры и медиа
green  = "#8FBF7A"   # успех, «в порядке», финансы
violet = "#A7A3F0"   # Haotica, ИИ
sky    = "#4FA6DC"   # система, сеть, разработка

[categories]
ai = "violet"
chat = "teal"
social = "amber"
dev = "sky"
finance = "green"
media = "coral"
system = "sky"

[profiles.MIX]
