# HAOTICA — настройки по умолчанию.
# Пользовательские значения лежат в ~/.config/haotica/settings.toml и перекрывают эти.

[appearance]
profile = "MIX"            # MIX, HYPERION, SUBJECT, ESCAPE, ARCH, RIDER, SPACE, CUSTOM
ui_scale = 1.6
density = "normal"         # compact, normal, airy
font_ui = "IBM Plex Sans"
font_mono = "IBM Plex Mono"
font_term = "JetBrains Mono"
font_size = 10.5
term_font_size = 12
chamfer = 8
radius = 4
icon_theme = "HAOTICA"
cursor_theme = "HAOTICA"
cursor_size = 24
wallpaper = "statue"       # statue, nebula, contour, plain, custom
wallpaper_custom = ""
wallpaper_live = true
liveliness = 0.65          # 0..1, «живость» фона и интерфейса

[appearance.custom]        # свой профиль (CUSTOM): любые токены палитры
# ink = "#E8DFC9"

[effects]
glow = 0.25
scanlines = 0.02           # только HUD и терминал
grain = 0.03
crt_terminal = 0.85        # CRT терминала: строки, расхождение лучей, свечение, виньетка (0…1)
crt_avatar = 0.25          # CRT аватара Haotica — добавляется поверх CRT терминала
terminal_art = true        # фон окна сеанса: «Сотворение Адама» из живого кода
terminal_art_opacity = 0.22   # фон не должен «менять оттенок» окна
crt_screen = 0.35          # лёгкий CRT на весь экран — интерфейс и окна (0 — выкл.)
crt_fullscreen_off = true  # снимать экранный CRT, пока открыто полноэкранное окно (видео, игры)
glitch = 1.0               # интенсивность событийного глитча
blur = true

[animations]
preset = "SIGNAL"          # SIGNAL, CHAOS, BLUEPRINT, MINIMAL
speed = 1.0                # общий множитель скорости
window = 0.7               # CRT + ГЛИТЧ для окон
scan = 0.5
decode = 0.5
reduce_motion = false

[sound]
theme = "haotica"
volume = 0.55
ui_sounds = true
voice_lines = true
emotions = true
hover = false
quiet_hours = true
quiet_start = "23:00"
quiet_end = "08:00"

[sound.events]             # каждое событие можно выключить: имя = false

[locale]
ui_language = "ru"         # ru, en, de
hud_language = "en"        # en или "ui" (как интерфейс)
layouts = ["de", "ru"]
ru_variant = ""            # "" — ЙЦУКЕН, "phonetic" — ЯВЕРТЫ
switch = "alt_shift"       # alt_shift, super_space, caps
per_window_layout = true
lc_time = "ru_RU.UTF-8"
lc_numeric = "ru_RU.UTF-8"
lc_monetary = "de_DE.UTF-8"
lc_paper = "de_DE.UTF-8"
lc_measurement = "de_DE.UTF-8"
first_weekday = 1          # 1 = понедельник
timezone = "auto"
weather_city = "Berlin"
spellcheck = ["ru", "de", "en"]
haotica_language = "ru"

[display]
refresh = 165
battery_refresh = 60
scale = 1.6
vrr = true
hdr = false
bitdepth = 10
night_light = false
night_start = "22:00"
night_end = "07:00"
night_temperature = 4500

[keyboard]
backlight = "palette"      # palette, haotica, static, off
backlight_color = "#E0A243"
backlight_brightness = 2
backlight_auto_off = true
copilot_key = "haotica"
repeat_delay = 300
repeat_rate = 35

[touchpad]
natural_scroll = true
tap_to_click = true
speed = 0.0
disable_while_typing = true

[power]
profile_ac = "performance"
profile_battery = "balanced"
conservation = true
charge_limit = 80
lid = "suspend"
autolock_minutes = 10
screen_off_minutes = 15
suspend_minutes = 30
haotica_on_battery = "normal"   # normal, light (только маленькая модель), off

[terminal]                  # HAOTICA Terminal (Windows и Linux)
default_profile = ""        # "" — первый найденный: PowerShell 7 → Windows PowerShell → cmd (Linux — своя оболочка)
font = ""                   # "" — моноширинный шрифт темы
font_size = 13
line_height = 1.18
ligatures = false
scrollback = 20000          # строк истории: 1 000 – 100 000
cursor_style = "bar"        # bar, block, underline
cursor_blink = true
bell = "visual"             # sound, visual, off
copy_on_select = false
right_click = "menu"        # menu, paste, copy_paste
ctrl_v_paste = true         # Ctrl+V вставляет (как в Windows Terminal); иначе уходит в программу
paste_warn = true           # предупреждать о многострочной вставке
restore_tabs = true
confirm_close = true        # спрашивать перед закрытием окна с работающими программами
close_on_exit = "graceful"  # graceful (закрыть при коде 0), always, never
haotica_tab = "separate"    # где Haotica выполняет команды: separate (своя вкладка), active (текущая)
profiles = []               # свои профили: [{id, name, command, cwd, env}]

[terminal.keys]             # переопределение клавиш: "ctrl+shift+t" = "newTab" (список действий — docs/UI-INVENTORY.md)

[haotica]
enabled = true
mode = "copilot"           # observer, copilot, agent
autonomy = "readonly"      # none, readonly, safe
unrestricted = false       # «без ограничений»: всё без карточек (в т. ч. опасное), без отказов; закрытые зоны и маскировка секретов остаются
directness = 0.85
humor = 0.75
swearing = "moderate"      # off, moderate, free
proactive = "sometimes"    # never, sometimes, often
max_unprompted_per_hour = 6
voice = true
voice_backend = "local"    # local (свой синтез, при сбое ElevenLabs), elevenlabs, lines (только готовые реплики)
tts_engine = "auto"        # auto (Chatterbox с голосом Сары, иначе Piper), chatterbox, piper
voice_speed = 1.0
voice_pause_scale = 0.35    # паузы между фразами: 1 — естественные, 0 — подряд
voice_quality = "fast"      # голос на CPU: best (fp32, 10 шагов), balanced (bf16, 8), fast (bf16, 6 — быстрее, почти без потерь)
voice_decoder = "turbo"     # декодер звука Chatterbox: turbo (2 шага, ~4× быстрее, голос тот же), standard
voice_flow = "continuous"   # continuous — речь без разрывов (начинает, когда хватит запаса), fast — сразу, с паузами на синтез
voice_max_chars = 600      # сколько читать вслух (до конца фразы); остальное — в чате. Синтез на CPU ~1,9× дольше звучания
voice_threads = 0          # потоков процессора на синтез голоса; 0 — 2/3 ядер (окно и программы не тормозят)
voice_pitch = 0.0          # тон Сары, полутоны относительно образца: 0 — как у Сары ElevenLabs (≈ 240 Гц); ниже — глубже, но меньше похоже
memory = true
avatar = "auto"            # auto (Live2D, если есть модель), svg
folders_allowed = ["~"]
folders_denied = ["~/.ssh", "~/.gnupg", "~/.local/share/keyrings"]
model_mode = "auto"        # auto — Haotica сама выбирает модель; base — всегда Qwen3.8-27B; deep — всегда Coder-Next
deep_idle_min = 10         # после глубокой задачи вернуться на base через N минут простоя
prefer_deep = false        # deep (80B MoE) — основная в «авто»: ~40 ток/с против ~10 у base, но ≈ 40 ГБ памяти
max_steps = 40            # шагов инструментов за ход; на последнем модель подводит итог вместо «слишком много шагов»
vision = true             # зрение base (проектор картинок, ~1 ГБ памяти); выключено — картинки не разбирает
cache_ram_mib = 1024       # кэш подсказок llama-server в оперативной памяти (по умолчанию у сервера 8 ГиБ, растёт по ходу работы)
ctx_checkpoints = 4        # контрольные точки контекста на слот (гибридные модели, ~150 МБ каждая; у сервера по умолчанию 32)
draft_n_max = 3            # драфт DFlash у base: 3 — замер на Radeon 8060S
gpu_reserve_mib = 3072     # запас памяти видеокарты для --fit (быстрая модель, окно)
speculative = "auto"       # auto (DFlash-драфт у base, n-граммы у deep), draft, ngram, none
context_size = 65536       # окно контекста моделей; base всё равно ограничивается 64K, deep берёт столько же (меньше KV-кэш)

[cloud]
enabled = true             # облако — когда есть ключ OpenRouter; false — явный запрет
model = ""
effort = "medium"
mode = "ask"               # ask, auto_under, never
auto_under_usd = 0.02
budget_request_usd = 0.5
budget_day_usd = 2.0
budget_month_usd = 20.0
helpers_enabled = true
helper_fast = "deepseek/deepseek-v4.1-flash"
helper_careful = "anthropic/claude-haiku-5.5"
helpers_task_usd = 0.05
helpers_day_usd = 1.0
helpers_per_hour = 30
search_backend = "searxng" # searxng, openrouter

[gestures]
enabled = false
pause_on_battery = true
activation = "palm_hold"

[gestures.bindings]

[security]
face_unlock = true
face_at_boot = false
sudo_face = false

[apps]
show_kde = true            # пока своих приложений нет — запасные KDE видны
browser = "google-chrome.desktop"
terminal = "haotica-terminal.desktop"
files = "haotica-files.desktop"
editor = "org.kde.kate.desktop"
viewer = "org.kde.gwenview.desktop"
player = "mpv.desktop"

[notifications]
dnd = false
dnd_scheduled = false
dnd_start = "23:00"
dnd_end = "08:00"

[desktop]
widgets = ["dossier", "clock", "globe", "bust"]
bar_position = "top"
dock_autohide = false
workspaces = 6
hud_log = true

[network]
recon = true
recon_interval_minutes = 15
alert_new_devices = true

[router]
vendor = ""
host = ""
username = ""

[gamemode]
unload_llm = true
pause_effects = true
pause_gestures = true
pause_recon = true
