<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0F1B3D">
  <title>Nori-Dex · The Sky Project: Land of Noris</title>
  <meta name="description" content="Nori-Dex: an interactive bestiary and promo hub for The Sky Project: Land of Noris by Enthariel Games.">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/sections.css">
  <link rel="stylesheet" href="css/stage.css">
  <link rel="stylesheet" href="css/quiz.css">
  <link rel="stylesheet" href="css/console3d.css">
</head>
<body class="is-intro jc-off">

  <!-- Page backdrop: official art + ambient light from the screen -->
  <div class="bg" aria-hidden="true">
    <div class="bg-img"></div>
    <div class="bg-shade"></div>
  </div>

  <main class="stage" id="stage">
    <div class="console-wrap" id="consoleWrap">
      <div class="floor-glow" aria-hidden="true"></div>

      <div class="console" id="console">

        <!-- LEFT CONTROLLER (replaced in O3) -->
        <div class="joycon joycon--left">
          <button class="jc-shoulder" data-btn="l" data-tip="Previous relic" data-key="Q" aria-label="L button">
            <svg viewBox="0 0 170 120" aria-hidden="true">
              <path class="gs" d="M6 66 A112 117 0 0 1 108 -4 L138 -4" /><path class="sh" d="M6 66 A112 117 0 0 1 108 -4 L138 -4" />
              <g class="cap"><path class="vis" d="M6 66 A112 117 0 0 1 108 -4 L138 -4" /><path class="rim" d="M6 66 A112 117 0 0 1 108 -4 L138 -4" /></g>
              <path class="hit" d="M6 66 A112 117 0 0 1 108 -4 L138 -4" />
            </svg>
          </button>
          <div class="jc-shell"></div>

          <button class="ctl jc-minus" style="--x:143px;--y:52px" data-btn="minus" data-tip="Sound on / off" data-key="M" aria-label="Minus: sound">
            <b class="cap"><i></i></b>
          </button>

          <div class="ctl stick" style="--x:90px;--y:130px" data-stick="left" data-tip="Navigate (drag)" aria-label="Left stick">
            <div class="stick-cap"><i class="st-sh"></i><i class="st-wall"></i><i class="st-top"><b></b></i></div>
          </div>

          <div class="dpad" style="--x:90px;--y:272px">
            <button class="dbtn" style="--dx:0px;--dy:-45px" data-btn="up" data-tip="Up" data-key="↑" aria-label="Up"><b class="cap"><svg viewBox="0 0 10 10"><path d="M5 2.2 8.2 7.4H1.8z" /></svg></b></button>
            <button class="dbtn" style="--dx:-45px;--dy:0px" data-btn="left" data-tip="Left" data-key="←" aria-label="Left"><b class="cap"><svg viewBox="0 0 10 10"><path d="M2.2 5 7.4 1.8v6.4z" /></svg></b></button>
            <button class="dbtn" style="--dx:45px;--dy:0px" data-btn="right" data-tip="Right" data-key="→" aria-label="Right"><b class="cap"><svg viewBox="0 0 10 10"><path d="M7.8 5 2.6 8.2V1.8z" /></svg></b></button>
            <button class="dbtn" style="--dx:0px;--dy:45px" data-btn="down" data-tip="Down" data-key="↓" aria-label="Down"><b class="cap"><svg viewBox="0 0 10 10"><path d="M5 7.8 1.8 2.6h6.4z" /></svg></b></button>
          </div>

          <button class="ctl jc-capture" style="--x:118px;--y:372px" data-btn="capture" data-tip="Save a photo" data-key="C" aria-label="Save a photo">
            <b class="cap"><i></i></b>
          </button>
        </div>

        <!-- BODY -->
        <div class="body">
          <button class="top-btn top-btn--power" data-btn="power" data-tip="Power" data-key="P" aria-label="Power"></button>
          <button class="top-btn top-btn--vol" style="left:190px" data-btn="voldown" data-tip="Volume −" data-key="[" aria-label="Volume down"></button>
          <button class="top-btn top-btn--vol" style="left:226px" data-btn="volup" data-tip="Volume +" data-key="]" aria-label="Volume up"></button>
          <div class="top-slot" aria-hidden="true"></div>

          <div class="body-shell">
            <div class="vents" aria-hidden="true"></div>
            <i class="rail rail--l" aria-hidden="true"></i><i class="rail rail--r" aria-hidden="true"></i>
            <i class="spk spk--l" aria-hidden="true"></i><i class="spk spk--r" aria-hidden="true"></i>
          </div>
          <!-- socket on top: the cable plugs in here -->
          <div class="port" id="port" aria-hidden="true"><i class="port-led" id="portLed"></i><i class="port-spark" id="portSpark"></i></div>
          <!-- relic slot at the bottom -->
          <div class="cart-slot" id="cartSlot" aria-hidden="true"><i class="slot-led" id="slotLed"></i></div>

          <div class="glass">
            <i class="sensor" aria-hidden="true"></i>

            <div class="screen" id="screen">
              <div class="crt" id="crt">
                <canvas id="static" width="384" height="216" aria-hidden="true"></canvas>

                <!-- VIEW 1: idle mist + Awaken -->
                <section class="view view-static" data-view="static">
                  <div class="osd osd-tl">NORI-DEX</div>
                  <div class="osd osd-tr"><span class="blink">NO RELIC</span></div>
                  <div class="play-wrap">
                    <button class="play" id="playBtn" aria-label="Awaken the device">
                      <span class="play-ring"></span>
                      <span class="play-core">
                        <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M14 9.5v21L31 20z" /></svg>
                      </span>
                    </button>
                    <div class="glitch play-label" data-text="AWAKEN">AWAKEN</div>
                    <div class="play-hint">click or press <b class="badge">Enter</b></div>
                  </div>
                  <div class="osd osd-bl"><span id="osdClock">00:00</span></div>
                </section>

                <!-- VIEW 2: boot -->
                <section class="view view-boot" data-view="boot">
                  <svg class="boot-ring" viewBox="0 0 120 120" aria-hidden="true"><circle class="br-ring" cx="60" cy="60" r="52" /><circle class="br-halo" cx="60" cy="60" r="30" /></svg>
                  <div class="glitch boot-logo" data-text="NORI-DEX" id="bootLogo">NORI-DEX</div>
                  <div class="boot-sub" id="bootSub"></div>
                  <div class="boot-bar"><i></i></div>
                </section>

                <!-- VIEW 3: relic altar -->
                <section class="view view-home" data-view="home">
                  <div class="home-bg" aria-hidden="true"></div>
                  <header class="hud-top">
                    <div class="hud-left"><span class="avatar" data-icon="crystal"></span><span class="user-name">Relic altar</span></div>
                    <div class="status">
                      <span class="clock" id="clock">00:00</span>
                                            <span class="battery"><i></i></span>
                    </div>
                  </header>
                  <div class="home-title" id="homeTitle">
                    <b></b><span></span>
                  </div>
                  <div class="tiles-viewport">
                    <div class="tiles" id="tiles"></div>
                  </div>
                  <nav class="dock" id="dock" aria-label="System menu"></nav>
                </section>

                <!-- VIEW 4: the seated relic's screen (js/sections.js) -->
                <section class="view view-section" data-view="section">
                  <div class="tabs">
                    <span class="tab-key" data-btn-proxy="l">L</span>
                    <div class="tab-list" id="tabList"></div>
                    <span class="tab-key" data-btn-proxy="r">R</span>
                  </div>
                  <div class="section-scroll" id="sectionScroll"></div>
                </section>

                <!-- Hint bar at the bottom of the screen -->
                <footer class="hints" id="hints">
                  <div class="hints-left">
                    <span class="hints-ico" data-icon="gamepad"></span>
                    <span id="hintsBrand">NORI-DEX</span>
                  </div>
                  <div class="hints-right" id="hintsRight"></div>
                </footer>

                <!-- Controls help -->
                <div class="help" id="help" aria-hidden="true">
                  <div class="help-panel">
                    <div class="help-head">
                      <b>Controls</b>
                      <span>Device buttons · mouse · keyboard · gamepad</span>
                    </div>
                    <div class="help-grid" id="helpGrid"></div>
                    <div class="help-foot"><b class="badge">B</b> or <b class="badge">+</b> to close</div>
                  </div>
                </div>

                <!-- Glass effects -->
                <div class="fx fx-scan" aria-hidden="true"></div>
                <div class="fx fx-roll" aria-hidden="true"></div>
                <div class="fx fx-vignette" aria-hidden="true"></div>
                <div class="fx fx-flash" id="flash" aria-hidden="true"></div>

                <!-- OSD on top of everything -->
                <div class="toast" id="toast" role="status" aria-live="polite"></div>
                <div class="osd-vol" id="osdVol" aria-hidden="true">
                  <span class="osd-vol-label" id="osdVolLabel">VOL</span>
                  <span class="osd-vol-bars" id="osdVolBars"></span>
                </div>
              </div>
            </div>

          </div>
        </div>

        <!-- RIGHT CONTROLLER (replaced in O3) -->
        <div class="joycon joycon--right">
          <button class="jc-shoulder" data-btn="r" data-tip="Next relic" data-key="E" aria-label="R button">
            <svg viewBox="0 0 170 120" aria-hidden="true">
              <path class="gs" d="M6 66 A112 117 0 0 1 108 -4 L138 -4" /><path class="sh" d="M6 66 A112 117 0 0 1 108 -4 L138 -4" />
              <g class="cap"><path class="vis" d="M6 66 A112 117 0 0 1 108 -4 L138 -4" /><path class="rim" d="M6 66 A112 117 0 0 1 108 -4 L138 -4" /></g>
              <path class="hit" d="M6 66 A112 117 0 0 1 108 -4 L138 -4" />
            </svg>
          </button>
          <div class="jc-shell"></div>

          <button class="ctl jc-plus" style="--x:28px;--y:52px" data-btn="plus" data-tip="Help" data-key="+" aria-label="Plus: help">
            <b class="cap"><i></i><i></i></b>
          </button>

          <div class="abxy" style="--x:80px;--y:132px">
            <button class="fbtn" style="--dx:0px;--dy:-45px" data-btn="x" data-tip="X" data-key="X" aria-label="X"><b class="cap">X</b></button>
            <button class="fbtn" style="--dx:-45px;--dy:0px" data-btn="y" data-tip="Glass effect" data-key="Y" aria-label="Y"><b class="cap">Y</b></button>
            <button class="fbtn" style="--dx:45px;--dy:0px" data-btn="a" data-tip="Select" data-key="Enter" aria-label="A"><b class="cap">A</b></button>
            <button class="fbtn" style="--dx:0px;--dy:45px" data-btn="b" data-tip="Back" data-key="Esc" aria-label="B"><b class="cap">B</b></button>
          </div>

          <div class="ctl stick" style="--x:80px;--y:272px" data-stick="right" data-tip="Scroll (drag)" aria-label="Right stick">
            <div class="stick-cap"><i class="st-sh"></i><i class="st-wall"></i><i class="st-top"><b></b></i></div>
          </div>

          <button class="ctl jc-home" style="--x:52px;--y:372px" data-btn="home" data-tip="Relic altar" data-key="H" aria-label="Home">
            <b class="cap"><span data-icon="home"></span></b>
          </button>
        </div>

      </div>

      <!-- DOCK: relic rack and info card of the selected relic -->
      <div class="dock-zone" id="dockZone">
        <div class="rack-clip" id="rackClip">
          <div class="rack-lip" aria-hidden="true"></div>
          <div class="rack-stage" id="rackStage"></div>
        </div>
        <div class="cart-info" id="cartInfo" aria-live="polite"></div>
      </div>
    </div>
  </main>

  <!-- power cable (drawn above the device) -->
  <canvas id="cable" aria-hidden="true"></canvas>

  
  <div class="tip" id="tip" role="tooltip"></div>

  <!-- scripts: keep this list and CORE in scripts/build.mjs identical -->
  <script src="js/i18n.js"></script>
  <script src="data/sky.js"></script>
  <script src="js/motion.js"></script>
  <script src="js/config.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/static.js"></script>
  <script src="js/input.js"></script>
  <script src="js/cable.js"></script>
  <script src="js/carts.js"></script>
  <script src="js/sections.js"></script>
  <script src="js/quiz-data.js"></script>
  <script src="js/quiz.js"></script>
  <script src="js/shot.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
