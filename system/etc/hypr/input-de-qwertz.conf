# HAOTICA OS // HYPRLAND INPUT & KEYBINDS FOR EDUARD'S LENOVO ISO-DE QWERTZ KEYBOARD
# Physical layout detected from hardware: German ISO 105-key QWERTZ (strg, fn, alt gr, Z/Y, Ü/Ö/Ä/ß, <>|, einfg/druck/entf)

input {
    kb_model = pc105
    kb_layout = de,ru
    kb_variant = nodeadkeys,
    kb_options = grp:alt_shift_toggle,caps:escape_shifted_capslock
    follow_mouse = 1
    sensitivity = 0.0

    touchpad {
        natural_scroll = true
        tap-to-click = true
        disable_while_typing = true
    }
}

# Base Modifiers (STRG = CTRL, SUPER = WIN)
$mainMod = SUPER

# Core Applications
bind = $mainMod, Return, exec, haotica-open terminal
bind = $mainMod, E, exec, haotica-open editor
bind = $mainMod, D, exec, haotica-open docs
bind = $mainMod, B, exec, google-chrome-stable --enable-features=UseOzonePlatform --ozone-platform=wayland
bind = $mainMod, W, exec, haotica-open weather
bind = $mainMod, K, exec, haotica-open keybinds
bind = $mainMod, Space, exec, haotica-launcher
bind = $mainMod, L, exec, haotica-lock

# ISO-DE Specific Ergonomic Binds (<>| key next to Left Shift, Ü/Ö/Ä/ß keys)
bind = $mainMod, less, exec, haotica-open assistant
bind = $mainMod,udiaeresis, workspace, e+1
bind = $mainMod,odiaeresis, workspace, e-1
bind = $mainMod,adiaeresis, togglefloating,
bind = $mainMod, ssharp, fullscreen, 1
bind = $mainMod, Y, exec, haotica-open clipboard
bind = $mainMod, Z, exec, haotica-undo

# Function Row (Lenovo Fn/F1..F12 + einfg/druck/entf)
bind = , Print, exec, haotica-open screenshot
bind = $mainMod, Print, exec, haotica-ocr-region
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bind = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bind = , XF86Calculator, exec, haotica-open calculator
